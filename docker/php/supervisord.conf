[supervisord]

nodaemon=true

[program:php-fpm]

command=php-fpm

autostart=true

autorestart=true

stdout_logfile=/dev/stdout

stderr_logfile=/dev/stderr

[program:laravel-worker]

process_name=%(program_name)s_%(process_num)02d

command=php /var/www/artisan queue:work --sleep=3 --tries=3

autostart=true

autorestart=true

numprocs=1

stdout_logfile=/dev/stdout

stderr_logfile=/dev/stderr