version: "3.9"

name: restaurant-booking-system

services:

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - app-network
    environment:
      - PHP_FPM_LISTEN=9000

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_booking
      POSTGRES_USER: restaurant_booking
      POSTGRES_PASSWORD: secret
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - restaurant_booking_postgres:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - restaurant_booking_redis:/data
    networks:
      - app-network

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - restaurant_booking_minio:/data
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    networks:
      - app-network

  composer:
    image: composer:latest
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - app-network

volumes:

  restaurant_booking_postgres:

  restaurant_booking_redis:

  restaurant_booking_minio:

networks:

  app-network:
    driver: bridge