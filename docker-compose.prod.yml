version: "3.9"

name: restaurant-booking-prod

services:

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www
      - ./frontend/build:/var/www/frontend/build
    depends_on:
      - php
    networks:
      - app

  php:
    container_name: php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    environment:
      APP_ENV: production
    depends_on:
      - postgres
      - redis
    networks:
      - app

  postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: restaurant_booking
      POSTGRES_USER: restaurant_booking
      POSTGRES_PASSWORD: CHANGE_ME_STRONG
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - app

  minio:
    image: minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: CHANGE_ME_STRONG
    volumes:
      - miniodata:/data
    networks:
      - app

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  app:
    driver: bridge